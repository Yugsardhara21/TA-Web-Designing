<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Layout</title>
  <style>
    /* 1. General Reset */
    body {
      font-family: "Times New Roman", serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 2. Header Section (White with Blue Links) */
    header {
      display: flex;
      /* Aligns Logo and Links in a row */
      justify-content: space-between;
      /* Pushes them to opposite sides */
      align-items: center;
      padding: 10px 20px;
      background-color: white;
      border-bottom: 1px solid #ccc;
      /* Optional faint line */
    }

    .header-links a {
      text-decoration: none;
      color: blue;
      font-size: 20px;
      margin-left: 15px;
      /* Space between links */
    }

    /* 3. Main Container (Sidebar + Content) */
    .main-wrapper {
      display: flex;
      /* KEY: Puts Sidebar and Content side-by-side */
      min-height: 500px;
      /* Ensures the page is tall enough */
    }

    /* 4. Sidebar Styles (Red) */
    .sidebar {
      width: 250px;
      /* Fixed width for sidebar */
      background-color: red;
      flex-shrink: 0;
      /* Prevents sidebar from shrinking */
    }

    .sidebar-item {
      padding: 15px;
      text-align: center;
      font-size: 18px;
      color: black;
      /* The yellow border separator */
      border-bottom: 2px solid yellow;
      font-weight: bold;
      cursor: pointer;
    }

    /* 5. Content Area (Student Grid) */
    .content {
      flex-grow: 1;
      /* Takes up all remaining space */
      padding: 20px;
      /* Create a grid layout for profiles */
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      /* Space between profiles */
    }

    /* Individual Profile Card */
    .profile {
      width: 180px;
      /* Width of each student block */
    }

    .profile img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border: 1px solid #333;
    }

    .profile-text {
      font-size: 14px;
      margin-top: 5px;
    }

    /* 6. Footer Section (Blue) */
    footer {
      background-color: blue;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
    }
  </style>
</head>

<body>
